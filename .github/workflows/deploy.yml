name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Backend → Render
  # ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl --silent --show-error --fail \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
